name: Tests du moteur d'adaptation

on:
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "public/index.html"
      - "tests/**"
      - ".github/workflows/adaptive-tests.yml"
  push:
    branches:
      - main
      - feature/longitudinal-load-trend

permissions:
  contents: read

jobs:
  adaptive-engine:
    name: Tests unitaires — moteur d'adaptation
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Exécuter les tests
        run: node --test tests/test_adaptive_engine.mjs tests/test_training_roles.mjs tests/test_brick_integrity.mjs tests/test_longitudinal_load.mjs tests/test_longitudinal_guidance.mjs tests/test_coaching_intelligence.mjs tests/test_coaching_integration.mjs
